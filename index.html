<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>تسهيل أصول الشاشي — Md. Ashikur Rahman</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Aref+Ruqaa:wght@700&family=Dancing+Script:wght@700&family=Noto+Naskh+Arabic:wght@400;700&family=Noto+Sans+Bengali:wght@400;600;700&display=swap">
<style>
  :root {
    --bg-surface: #e8e3d5;
    --blob-1: rgba(13, 74, 54, 0.14);
    --blob-2: rgba(212, 175, 55, 0.18);
    --card-bg: #fcfaf4;
    --card-border: #d8ceb7;
    --primary: #0d4a36;
    --primary-deep: #073324;
    --primary-soft: #e6f1ec;
    --accent: #b89130;
    --accent-bright: #d4af37;
    --accent-soft: rgba(184, 145, 48, 0.14);
    --ar-bg: #faf6eb;
    --bn-bg: #eef5f1;
    --text-main: #1a2923;
    --text-muted: #5a6860;
    --ar-text: #271e12;
    --arword-color: #7d4f00;
    --ayah-color: #0d4a36;
    --hadith-color: #8f2424;
    --note-bg: #faf0d4;
    --note-text: #563e05;
    --masail-bg: #fdfbf5;
    --masail-alt: #f2ede0;
    --shadow-soft: 0 6px 20px rgba(15, 32, 24, 0.08);
    --font-scale: 1;
    --theme-speed: 0.55s;
  }

  body.is-dynamic-mode {
    --theme-speed: 1.8s;
  }

  /* Theme 2: Classic Parchment (ক্লাসিক কাগজ) */
  body[data-theme="parchment"] {
    --bg-surface: #e7ddd0;
    --blob-1: rgba(125, 84, 41, 0.15);
    --blob-2: rgba(202, 158, 76, 0.19);
    --card-bg: #fbf7ee;
    --card-border: #d6c7ad;
    --primary: #593b1f;
    --primary-deep: #3d2712;
    --primary-soft: #f2eadc;
    --accent: #a67c37;
    --accent-bright: #c59b48;
    --accent-soft: rgba(166, 124, 55, 0.15);
    --ar-bg: #f8f2e4;
    --bn-bg: #f2ece0;
    --text-main: #2b2016;
    --text-muted: #6c5b49;
    --ar-text: #24170b;
    --arword-color: #82490d;
    --ayah-color: #593b1f;
    --hadith-color: #8b2323;
    --note-bg: #f4e6c8;
    --note-text: #4d3512;
    --masail-bg: #fcf8ef;
    --masail-alt: #f2ead8;
  }

  /* Theme 3: Royal Navy (রয়েল নেভি) */
  body[data-theme="navy"] {
    --bg-surface: #dfe5ee;
    --blob-1: rgba(23, 52, 77, 0.16);
    --blob-2: rgba(212, 175, 55, 0.17);
    --card-bg: #ffffff;
    --card-border: #cfd8e3;
    --primary: #17344d;
    --primary-deep: #0d2133;
    --primary-soft: #e9f0f7;
    --accent: #c29b38;
    --accent-bright: #dfb84c;
    --accent-soft: rgba(194, 155, 56, 0.14);
    --ar-bg: #fbf9f3;
    --bn-bg: #edf3f9;
    --text-main: #18293a;
    --text-muted: #5a6c7e;
    --ar-text: #231b11;
    --arword-color: #845500;
    --ayah-color: #17344d;
    --hadith-color: #962828;
    --note-bg: #fbf3db;
    --note-text: #553f07;
    --masail-bg: #fffdf8;
    --masail-alt: #eef3f8;
  }

  /* Theme 4: Classic Maroon (রাজকীয় মেরুন) */
  body[data-theme="maroon"] {
    --bg-surface: #ece2e6;
    --blob-1: rgba(94, 27, 48, 0.16);
    --blob-2: rgba(212, 175, 55, 0.17);
    --card-bg: #fffcfd;
    --card-border: #dfd0d5;
    --primary: #5e1b30;
    --primary-deep: #3f101f;
    --primary-soft: #f7ecf0;
    --accent: #ba9132;
    --accent-bright: #d4af37;
    --accent-soft: rgba(186, 145, 50, 0.14);
    --ar-bg: #fcf8f5;
    --bn-bg: #f8eef2;
    --text-main: #2a181e;
    --text-muted: #6e555e;
    --ar-text: #281914;
    --arword-color: #771d37;
    --ayah-color: #5e1b30;
    --hadith-color: #9b2226;
    --note-bg: #fbf1d8;
    --note-text: #593e09;
    --masail-bg: #fffbfa;
    --masail-alt: #f6eaee;
  }

  /* Theme 5: Deep Plum (সন্ধ্যাতারা পার্পল) */
  body[data-theme="purple"] {
    --bg-surface: #e7e2f0;
    --blob-1: rgba(57, 34, 82, 0.16);
    --blob-2: rgba(212, 175, 55, 0.16);
    --card-bg: #ffffff;
    --card-border: #d8d0e3;
    --primary: #392252;
    --primary-deep: #251538;
    --primary-soft: #f1ecf7;
    --accent: #b8943a;
    --accent-bright: #d4af37;
    --accent-soft: rgba(184, 148, 58, 0.14);
    --ar-bg: #fbf9fc;
    --bn-bg: #f2eef8;
    --text-main: #21182c;
    --text-muted: #605470;
    --ar-text: #231926;
    --arword-color: #522d75;
    --ayah-color: #392252;
    --hadith-color: #932727;
    --note-bg: #faf1da;
    --note-text: #563e09;
    --masail-bg: #fdfcff;
    --masail-alt: #f2edf7;
  }

  /* Theme 6: Peacock Teal (ময়ূরকণ্ঠী টিল) */
  body[data-theme="teal"] {
    --bg-surface: #dce9e9;
    --blob-1: rgba(12, 84, 96, 0.16);
    --blob-2: rgba(208, 166, 62, 0.17);
    --card-bg: #fdfffe;
    --card-border: #c5dad9;
    --primary: #0f525c;
    --primary-deep: #08343b;
    --primary-soft: #e6f3f4;
    --accent: #bc9332;
    --accent-bright: #d9b24c;
    --accent-soft: rgba(188, 147, 50, 0.14);
    --ar-bg: #faf8f1;
    --bn-bg: #ebf5f5;
    --text-main: #152b2e;
    --text-muted: #4f6c70;
    --ar-text: #241d12;
    --arword-color: #7d5204;
    --ayah-color: #0f525c;
    --hadith-color: #922828;
    --note-bg: #fbf1d6;
    --note-text: #563e07;
    --masail-bg: #fcfffe;
    --masail-alt: #ecf4f4;
  }

  /* Theme 7: Night Study Dark (রাত্রিকালীন ডার্ক) */
  body[data-theme="dark"] {
    --bg-surface: #0d1311;
    --blob-1: rgba(26, 110, 80, 0.22);
    --blob-2: rgba(207, 167, 74, 0.15);
    --card-bg: #151c1a;
    --card-border: #273631;
    --primary: #1a5c46;
    --primary-deep: #0e3a2b;
    --primary-soft: #1c2925;
    --accent: #cfa74a;
    --accent-bright: #e0bc63;
    --accent-soft: rgba(207, 167, 74, 0.15);
    --ar-bg: #1a221f;
    --bn-bg: #141c19;
    --text-main: #dce5e1;
    --text-muted: #93a69e;
    --ar-text: #f0ebe0;
    --arword-color: #e4be68;
    --ayah-color: #6dd4ae;
    --hadith-color: #e38686;
    --note-bg: #221e14;
    --note-text: #e0c784;
    --masail-bg: #19211e;
    --masail-alt: #141b18;
    --shadow-soft: 0 8px 24px rgba(0, 0, 0, 0.36);
  }

  /* Theme 8: Dynamic Night Aurora Base (ডাইনামিক নাইট অরোরা) */
  body[data-theme="dynamic-dark"] {
    --bg-surface: #0d151b;
    --blob-1: rgba(26, 128, 102, 0.28);
    --blob-2: rgba(196, 146, 54, 0.20);
    --card-bg: #13181f;
    --card-border: rgba(212, 175, 78, 0.28);
    --primary: #195449;
    --primary-deep: #0f362f;
    --primary-soft: #1c242e;
    --accent: #d4ad4e;
    --accent-bright: #e8c66e;
    --accent-soft: rgba(212, 173, 78, 0.15);
    --ar-bg: #192029;
    --bn-bg: #141a22;
    --text-main: #e2e8f0;
    --text-muted: #98a6b8;
    --ar-text: #f3ede2;
    --arword-color: #e8c36c;
    --ayah-color: #74d4bd;
    --hadith-color: #e88c8c;
    --note-bg: #221e16;
    --note-text: #e4cb89;
    --masail-bg: #19202a;
    --masail-alt: #141922;
    --shadow-soft: 0 8px 26px rgba(0, 0, 0, 0.40);
  }

  /* ===================== LIGHTWEIGHT FEATHERED GRADIENT BACKDROP (ZERO BLUR FILTER) ===================== */
  .ambient-stage {
    position: fixed;
    inset: 0;
    overflow: hidden;
    pointer-events: none;
    z-index: 0;
    contain: strict;
  }

  .ambient-orb {
    position: absolute;
    border-radius: 50%;
    pointer-events: none;
  }

  .ambient-orb-1 {
    width: 72vmax;
    height: 72vmax;
    top: -26vmax;
    left: -20vmax;
    background: radial-gradient(circle, var(--blob-1) 0%, transparent 68%);
  }

  .ambient-orb-2 {
    width: 68vmax;
    height: 68vmax;
    bottom: -26vmax;
    right: -20vmax;
    background: radial-gradient(circle, var(--blob-2) 0%, transparent 68%);
  }

  /* Gentle GPU-only drift ONLY when Dynamic Mode is active on Index view */
  body.is-dynamic-mode:not(.in-reader) .ambient-orb-1 {
    will-change: transform;
    animation: orbDrift1 16s ease-in-out infinite alternate;
  }
  body.is-dynamic-mode:not(.in-reader) .ambient-orb-2 {
    will-change: transform;
    animation: orbDrift2 20s ease-in-out infinite alternate;
  }

  @keyframes orbDrift1 {
    0% { transform: translate3d(0, 0, 0); }
    100% { transform: translate3d(8vw, 6vh, 0); }
  }
  @keyframes orbDrift2 {
    0% { transform: translate3d(0, 0, 0); }
    100% { transform: translate3d(-8vw, -7vh, 0); }
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    padding: 0;
    background-color: var(--bg-surface);
    font-family: 'Noto Sans Bengali', sans-serif;
    color: var(--text-main);
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
    transition: background-color var(--theme-speed) ease;
  }

  .app-shell {
    position: relative;
    z-index: 1;
    max-width: 820px;
    margin: 0 auto;
    padding: 0 14px 54px;
  }

  /* ===================== THEME SWITCH MICRO-TOAST ===================== */
  .theme-toast {
    position: fixed;
    left: 50%;
    bottom: 20px;
    transform: translate3d(-50%, 16px, 0);
    z-index: 110;
    background-color: var(--primary);
    color: #fdf8ee;
    border: 1px solid var(--accent-bright);
    padding: 7px 15px;
    border-radius: 999px;
    font-size: 12.5px;
    font-weight: 700;
    box-shadow: 0 6px 18px rgba(0,0,0,0.22);
    opacity: 0;
    pointer-events: none;
    display: inline-flex;
    align-items: center;
    gap: 7px;
    transition: opacity 0.24s ease, transform 0.24s ease;
    white-space: nowrap;
  }

  .theme-toast.show {
    opacity: 1;
    transform: translate3d(-50%, 0, 0);
  }

  .toast-dot {
    width: 9px;
    height: 9px;
    border-radius: 50%;
    background: var(--accent-bright);
  }

  /* ===================== INDEX VIEW (ONLY COVER + TOC) ===================== */
  #indexView {
    padding-top: 22px;
  }

  .book-stage {
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 6px 8px 26px;
  }

  .book-volume {
    position: relative;
    width: 100%;
    max-width: 318px;
    border-radius: 5px 11px 11px 5px;
    transition: transform 0.3s ease;
    box-shadow:
      -6px 12px 24px rgba(12, 18, 15, 0.24),
      -2px 4px 8px rgba(12, 18, 15, 0.14);
    background: #eceae0;
  }

  .book-volume::before {
    content: "";
    position: absolute;
    top: 4px;
    bottom: 4px;
    left: -6px;
    width: 6px;
    border-radius: 3px 0 0 3px;
    background: repeating-linear-gradient(
      90deg,
      #f8f4e8 0px,
      #f8f4e8 1px,
      #d6ccb8 1.5px,
      #ede7d8 2.5px
    );
  }

  .book-volume::after {
    content: "";
    position: absolute;
    top: 0;
    bottom: 0;
    right: 12px;
    width: 2px;
    background: linear-gradient(90deg, rgba(0,0,0,0.14), rgba(255,255,255,0.40), rgba(0,0,0,0.06));
    pointer-events: none;
    z-index: 4;
  }

  @media (hover: hover) {
    .book-volume:hover {
      transform: translateY(-3px);
    }
  }

  .book-cover-svg {
    display: block;
    width: 100%;
    height: auto;
    border-radius: 4px 10px 10px 4px;
  }

  .cover-signature-text {
    font-family: 'Dancing Script', cursive;
    font-size: 25.5px;
    font-weight: 700;
    letter-spacing: 0.3px;
  }

  /* Editorial Table of Contents Card (Crisp Solid Surface — No Backdrop Blur) */
  .toc-card {
    background-color: var(--card-bg);
    border: 1px solid var(--card-border);
    border-radius: 16px;
    box-shadow: var(--shadow-soft);
    overflow: hidden;
    transition: background-color var(--theme-speed) ease, border-color var(--theme-speed) ease;
  }

  .toc-head {
    padding: 16px 18px 14px;
    border-bottom: 1px solid var(--card-border);
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .toc-head-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    flex-wrap: wrap;
  }

  .toc-heading-group {
    display: flex;
    align-items: baseline;
    gap: 10px;
  }

  .toc-title {
    margin: 0;
    font-size: 18px;
    font-weight: 700;
    color: var(--primary);
    letter-spacing: -0.2px;
  }

  body[data-theme="dark"] .toc-title,
  body[data-theme="dynamic-dark"] .toc-title {
    color: var(--accent-bright);
  }

  .toc-count {
    font-size: 12.5px;
    color: var(--text-muted);
    font-weight: 500;
  }

  .toc-controls {
    display: flex;
    align-items: center;
    gap: 7px;
  }

  .icon-action {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 6px 11px;
    border-radius: 9px;
    border: 1px solid var(--card-border);
    background-color: var(--primary-soft);
    color: var(--primary);
    font-size: 12.5px;
    font-weight: 600;
    font-family: 'Noto Sans Bengali', sans-serif;
    cursor: pointer;
    touch-action: manipulation;
  }

  body[data-theme="dark"] .icon-action,
  body[data-theme="dynamic-dark"] .icon-action {
    color: var(--accent-bright);
  }

  .icon-action.primary-act {
    background-color: var(--primary);
    color: #fbf7ee !important;
    border-color: var(--primary);
  }

  .icon-action.unlocked-act {
    background-color: #176b45;
    color: #ffffff !important;
    border-color: #176b45;
  }

  .theme-btn-spin svg {
    transition: transform 0.35s ease;
  }

  .theme-btn-spin.spun svg {
    transform: rotate(180deg);
  }

  .toc-search-wrap {
    position: relative;
  }

  .toc-search-icon {
    position: absolute;
    left: 11px;
    top: 50%;
    transform: translateY(-50%);
    color: var(--text-muted);
    pointer-events: none;
    display: flex;
  }

  .toc-search {
    width: 100%;
    padding: 9px 12px 9px 34px;
    border-radius: 10px;
    border: 1px solid var(--card-border);
    background-color: var(--ar-bg);
    color: var(--text-main);
    font-size: 13.5px;
    font-family: 'Noto Sans Bengali', sans-serif;
    outline: none;
  }

  .toc-search:focus {
    border-color: var(--primary);
  }

  .toc-list {
    display: flex;
    flex-direction: column;
  }

  .toc-row {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 13px 18px;
    border: none;
    border-bottom: 1px solid var(--card-border);
    background: transparent;
    text-align: left;
    cursor: pointer;
    width: 100%;
    font-family: 'Noto Sans Bengali', sans-serif;
    color: var(--text-main);
    touch-action: manipulation;
  }

  .toc-row:last-child { border-bottom: none; }
  .toc-row:active,
  .toc-row:hover {
    background-color: var(--primary-soft);
  }

  .toc-num {
    width: 30px;
    height: 30px;
    border-radius: 9px;
    background-color: var(--primary-soft);
    border: 1px solid var(--card-border);
    color: var(--primary);
    font-weight: 700;
    font-size: 13px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }

  body[data-theme="dark"] .toc-num,
  body[data-theme="dynamic-dark"] .toc-num {
    color: var(--accent-bright);
  }

  .toc-row.is-locked .toc-num {
    background-color: transparent;
    color: var(--text-muted);
  }

  .toc-meta { flex: 1; min-width: 0; }

  .toc-meta-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    flex-wrap: wrap;
    margin-bottom: 3px;
  }

  .toc-page-label {
    font-size: 14.5px;
    font-weight: 700;
    color: var(--text-main);
  }

  .toc-ar-sub {
    font-family: 'Amiri', 'Noto Naskh Arabic', serif;
    font-size: 16.5px;
    color: var(--primary);
    direction: rtl;
    line-height: 1.4;
  }

  body[data-theme="dark"] .toc-ar-sub,
  body[data-theme="dynamic-dark"] .toc-ar-sub {
    color: var(--ayah-color);
  }

  .toc-bn-sub {
    font-size: 12.8px;
    color: var(--text-muted);
    line-height: 1.45;
  }

  .toc-status {
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    width: 28px;
    height: 28px;
    border-radius: 50%;
    color: var(--primary);
  }

  body[data-theme="dark"] .toc-status,
  body[data-theme="dynamic-dark"] .toc-status {
    color: var(--accent-bright);
  }

  .toc-row.is-locked .toc-status {
    color: var(--accent);
    background-color: var(--accent-soft);
  }

  /* ===================== READER VIEW (SEPARATE FROM INDEX) ===================== */
  #readerView {
    display: none;
  }

  .read-progress-track {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    height: 3px;
    background: transparent;
    z-index: 60;
    pointer-events: none;
  }

  .read-progress-bar {
    height: 100%;
    width: 100%;
    transform-origin: left center;
    transform: scaleX(0);
    background-color: var(--accent-bright);
    will-change: transform;
  }

  .reader-topbar {
    position: sticky;
    top: 0;
    z-index: 35;
    margin: 0 -14px 16px;
    padding: 10px 14px;
    background-color: var(--card-bg);
    border-bottom: 1px solid var(--card-border);
    box-shadow: 0 3px 10px rgba(0,0,0,0.06);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    transition: background-color var(--theme-speed) ease, border-color var(--theme-speed) ease;
  }

  .back-btn {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    border: 1px solid var(--card-border);
    background-color: var(--primary-soft);
    color: var(--primary);
    padding: 5px 11px;
    border-radius: 8px;
    font-size: 13px;
    font-weight: 700;
    cursor: pointer;
    font-family: 'Noto Sans Bengali', sans-serif;
    touch-action: manipulation;
  }

  body[data-theme="dark"] .back-btn,
  body[data-theme="dynamic-dark"] .back-btn {
    color: var(--accent-bright);
  }

  .reader-current-label {
    font-size: 13.5px;
    font-weight: 700;
    color: var(--text-main);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .reader-tools {
    display: flex;
    align-items: center;
    gap: 5px;
    flex-shrink: 0;
  }

  .mini-tool-btn {
    border: 1px solid var(--card-border);
    background-color: transparent;
    color: var(--text-main);
    height: 30px;
    padding: 0 8px;
    border-radius: 8px;
    font-size: 12px;
    font-weight: 700;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-family: 'Noto Sans Bengali', sans-serif;
    touch-action: manipulation;
  }

  .mini-tool-btn:active,
  .mini-tool-btn:hover {
    background-color: var(--primary-soft);
    color: var(--primary);
  }

  .reader-theme-btn {
    background-color: var(--primary-soft);
    color: var(--primary);
    border-color: var(--accent);
    width: 32px;
    padding: 0;
  }

  body[data-theme="dark"] .reader-theme-btn,
  body[data-theme="dynamic-dark"] .reader-theme-btn {
    color: var(--accent-bright);
  }

  .reader-paper {
    background-color: var(--card-bg);
    border: 1px solid var(--card-border);
    border-radius: 16px;

  .pagebadges {
    display: flex;
    justify-content: center;
    gap: 7px;
    flex-wrap: wrap;
    margin-bottom: 18px;
  }

  .pagebadges span {
    background-color: var(--accent-soft);
    color: var(--primary);
    border: 1px solid var(--accent);
    font-weight: 700;
    padding: 4px 12px;
    border-radius: 999px;
    font-size: 12.5px;
  }

  body[data-theme="dark"] .pagebadges span,
  body[data-theme="dynamic-dark"] .pagebadges span {
    color: var(--accent-bright);
  }

  /* ===================== VERBATIM ORIGINAL CONTENT CLASSES (OPTIMIZED PAINT) ===================== */
  .reader-body .chapter-title {
    text-align: center;
    background-color: var(--primary);
    background-image: linear-gradient(135deg, rgba(255,255,255,0.09), rgba(0,0,0,0.22));
    color: #fdf8ee;
    border-radius: 13px;
    padding: 18px 15px;
    margin: 0 0 22px;
    border: 1.5px solid var(--accent-bright);
    transition: background-color var(--theme-speed) ease, border-color var(--theme-speed) ease;
  }

  .reader-body .chapter-title .ar {
    font-family: 'Amiri', 'Noto Naskh Arabic', serif;
    font-size: calc(28px * var(--font-scale));
    color: #ffffff;
    line-height: 1.5;
  }

  .reader-body .chapter-title .bn {
    font-size: calc(14.5px * var(--font-scale));
    color: var(--accent-bright);
    margin-top: 6px;
    font-weight: 700;
    line-height: 1.5;
  }

  .reader-body .section {
    margin-bottom: 20px;
    border-radius: 13px;
    overflow: hidden;
    border: 1px solid var(--card-border);
    background-color: var(--card-bg);
    content-visibility: auto;
    contain-intrinsic-size: auto 240px;
  }

  .reader-body .sec-title {
    background-color: var(--primary);
    background-image: linear-gradient(90deg, rgba(255,255,255,0.06), rgba(0,0,0,0.12));
    color: #fdf8ee;
    padding: 10px 15px;
    font-size: calc(15px * var(--font-scale));
    font-weight: 700;
    display: flex;
    align-items: center;
    gap: 9px;
    line-height: 1.45;
    transition: background-color var(--theme-speed) ease;
  }

  .reader-body .sec-title .num {
    background-color: var(--accent-bright);
    color: var(--primary-deep);
    width: 24px;
    height: 24px;
    border-radius: 50%;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-size: 13px;
    font-weight: 700;
    flex-shrink: 0;
  }

  .reader-body .arabic-box {
    background-color: var(--ar-bg);
    padding: 16px 18px;
    direction: rtl;
    text-align: right;
    font-family: 'Amiri', 'Noto Naskh Arabic', serif;
    font-size: calc(22px * var(--font-scale));
    line-height: 2.25;
    color: var(--ar-text);
    border-bottom: 1.5px dashed var(--accent);
  }

  .reader-body .arabic-box .ayah {
    color: var(--ayah-color);
    font-weight: 700;
  }

  .reader-body .arabic-box .hadith {
    color: var(--hadith-color);
    font-weight: 700;
  }

  .reader-body .bn-box {
    background-color: var(--bn-bg);
    padding: 15px 18px;
    font-size: calc(15.5px * var(--font-scale));
    line-height: 1.9;
    color: var(--text-main);
  }

  .reader-body .bn-box b {
    color: var(--primary);
  }

  body[data-theme="dark"] .reader-body .bn-box b,
  body[data-theme="dynamic-dark"] .reader-body .bn-box b {
    color: var(--accent-bright);
  }

  .reader-body .bn-box .arword {
    font-family: 'Amiri', 'Noto Naskh Arabic', serif;
    color: var(--arword-color);
    font-weight: 700;
    font-size: calc(18.5px * var(--font-scale));
  }

  .reader-body .bn-box .hadithbn {
    color: var(--hadith-color);
    font-weight: 600;
  }

  .reader-body .page-tag,
  .reader-body .page12-tag {
    display: inline-block;
    background-color: var(--primary);
    color: #fdf6e3 !important;
    font-size: 11.5px;
    font-family: 'Noto Sans Bengali', sans-serif;
    padding: 2px 9px;
    border-radius: 8px;
    margin-bottom: 8px;
    margin-left: 6px;
    direction: ltr;
  }

  .reader-body .masail-item {
    display: flex;
    gap: 10px;
    padding: 12px 15px;
    border-bottom: 1px solid var(--card-border);
    background-color: var(--masail-bg);
    content-visibility: auto;
    contain-intrinsic-size: auto 120px;
  }

  .reader-body .masail-item:nth-child(even) {
    background-color: var(--masail-alt);
  }

  .reader-body .masail-item:last-child { border-bottom: none; }

  .reader-body .masail-item .mnum {
    background-color: var(--hadith-color);
    color: #ffffff;
    min-width: 24px;
    height: 24px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 12.5px;
    font-weight: 700;
    flex-shrink: 0;
    margin-top: 2px;
  }

  .reader-body .masail-item .mtext { flex: 1; min-width: 0; }

  .reader-body .masail-item .mtext .ar-line {
    direction: rtl;
    text-align: right;
    font-family: 'Amiri', 'Noto Naskh Arabic', serif;
    font-size: calc(19.5px * var(--font-scale));
    line-height: 2.05;
    color: var(--ar-text);
    margin-bottom: 6px;
  }

  .reader-body .masail-item .mtext .bn-line {
    font-size: calc(15px * var(--font-scale));
    color: var(--text-main);
    line-height: 1.8;
  }

  .reader-body .example-pair {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    padding: 13px 15px;
    background-color: var(--ar-bg);
  }

  .reader-body .example-pair .ex {
    flex: 1;
    min-width: 220px;
    background-color: var(--card-bg);
    border: 1px solid var(--card-border);
    border-radius: 10px;
    padding: 11px 13px;
  }

  .reader-body .example-pair .ex .tag {
    font-size: 12px;
    font-weight: 700;
    color: var(--hadith-color);
    margin-bottom: 6px;
  }

  .reader-body .example-pair .ex .ar {
    direction: rtl;
    text-align: right;
    font-family: 'Amiri', 'Noto Naskh Arabic', serif;
    font-size: calc(20px * var(--font-scale));
    color: var(--ayah-color);
    margin-bottom: 6px;
    line-height: 1.9;
  }

  .reader-body .example-pair .ex .bn {
    font-size: calc(14px * var(--font-scale));
    color: var(--text-main);
    line-height: 1.7;
  }

  .reader-body .divider {
    text-align: center;
    color: var(--accent);
    font-size: 18px;
    margin: 18px 0;
    letter-spacing: 8px;
  }

  .reader-body .note {
    background-color: var(--note-bg);
    border-left: 3.5px solid var(--accent-bright);
    padding: 11px 14px;
    font-size: calc(13.5px * var(--font-scale));
    color: var(--note-text);
    margin: 14px 0 8px;
    border-radius: 0 9px 9px 0;
    line-height: 1.7;
  }

  .reader-body .endnote {
    text-align: center;
    background-color: var(--primary);
    background-image: linear-gradient(135deg, rgba(255,255,255,0.06), rgba(0,0,0,0.14));
    color: #fdf8ee;
    padding: 13px 16px;
    border-radius: 11px;
    font-size: calc(14.5px * var(--font-scale));
    margin-top: 14px;
    line-height: 1.65;
  }

  .reader-nav-bottom {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
    margin-top: 20px;
    padding-top: 14px;
    border-top: 1px solid var(--card-border);
  }

  .nav-step-btn {
    background-color: var(--primary);
    color: #fdf8ee;
    border: none;
    padding: 9px 14px;
    border-radius: 9px;
    font-weight: 700;
    font-size: 13px;
    cursor: pointer;
    font-family: 'Noto Sans Bengali', sans-serif;
    touch-action: manipulation;
  }

  .nav-step-btn:disabled { opacity: 0.35; cursor: not-allowed; }

  /* ===================== COMPACT BOTTOM-LEFT FLOATING BUTTON (ONLY INSIDE CHAPTERS) ===================== */
  .fab-mini {
    position: fixed;
    left: 8px;
    bottom: 8px;
    z-index: 50;
    width: 34px;
    height: 34px;
    border-radius: 50%;
    background-color: var(--primary);
    color: var(--accent-bright);
    border: 1.5px solid var(--accent-bright);
    box-shadow: 0 3px 10px rgba(0, 0, 0, 0.24);
    cursor: pointer;
    display: none;
    align-items: center;
    justify-content: center;
    opacity: 0.90;
    padding: 0;
    touch-action: manipulation;
  }

  body.in-reader .fab-mini {
    display: flex;
  }

  /* ===================== CLEAN TOC-ONLY SLIDE-OUT DRAWER (GPU TRANSFORM) ===================== */
  .drawer-backdrop {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(8, 14, 12, 0.50);
    z-index: 70;
  }

  .drawer-backdrop.open { display: block; }

  .drawer-panel {
    position: fixed;
    top: 0;
    left: 0;
    width: 306px;
    max-width: 84vw;
    height: 100vh;
    background-color: var(--card-bg);
    color: var(--text-main);
    z-index: 80;
    box-shadow: 6px 0 24px rgba(0, 0, 0, 0.25);
    transform: translate3d(-105%, 0, 0);
    transition: transform 0.24s cubic-bezier(0.22, 1, 0.36, 1);
    will-change: transform;
    display: flex;
    flex-direction: column;
    border-right: 1px solid var(--card-border);
  }

  .drawer-panel.open {
    transform: translate3d(0, 0, 0);
  }

  .drawer-head {
    background-color: var(--primary);
    background-image: linear-gradient(135deg, rgba(255,255,255,0.08), rgba(0,0,0,0.20));
    color: #fdf8ee;
    padding: 15px 16px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-bottom: 1.5px solid var(--accent-bright);
  }

  .drawer-list {
    flex: 1;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    padding: 10px 10px 22px;
    display: flex;
    flex-direction: column;
    gap: 5px;
  }

  .drawer-item {
    width: 100%;
    text-align: left;
    padding: 9px 11px;
    border-radius: 9px;
    border: 1px solid transparent;
    background: transparent;
    color: var(--text-main);
    cursor: pointer;
    font-family: 'Noto Sans Bengali', sans-serif;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    touch-action: manipulation;
  }

  .drawer-item:hover { background-color: var(--primary-soft); }

  .drawer-item.active {
    background-color: var(--primary);
    color: #ffffff;
  }

  /* ===================== MODAL (PASSWORD UNLOCK) ===================== */
  .modal-backdrop {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(6, 14, 11, 0.64);
    z-index: 95;
    align-items: center;
    justify-content: center;
    padding: 16px;
  }

  .modal-backdrop.open { display: flex; }

  .modal-box {
    background-color: var(--card-bg);
    color: var(--text-main);
    border-radius: 16px;
    max-width: 390px;
    width: 100%;
    padding: 22px 20px;
    border: 1.5px solid var(--accent-bright);
    box-shadow: 0 14px 34px rgba(0,0,0,0.32);
    text-align: center;
  }

  .modal-box h3 {
    margin: 0 0 7px;
    color: var(--primary);
    font-size: 18px;
  }

  body[data-theme="dark"] .modal-box h3,
  body[data-theme="dynamic-dark"] .modal-box h3 {
    color: var(--accent-bright);
  }

  .modal-box p {
    margin: 0 0 14px;
    font-size: 13.5px;
    color: var(--text-muted);
    line-height: 1.6;
  }

  .pwd-input {
    width: 100%;
    padding: 10px 13px;
    border-radius: 10px;
    border: 1.5px solid var(--card-border);
    background-color: var(--ar-bg);
    color: var(--text-main);
    font-size: 15px;
    text-align: center;
    margin-bottom: 10px;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    outline: none;
  }

  .pwd-input:focus { border-color: var(--primary); }

  .err-msg {
    color: #c23030;
    font-size: 12.8px;
    font-weight: 700;
    min-height: 18px;
    margin-bottom: 10px;
  }

  .modal-btns {
    display: flex;
    gap: 8px;
    justify-content: center;
  }

  .btn-primary {
    background-color: var(--primary);
    color: #fdf8ee;
    border: none;
    padding: 9px 18px;
    border-radius: 9px;
    font-weight: 700;
    font-size: 13.5px;
    cursor: pointer;
    font-family: 'Noto Sans Bengali', sans-serif;
  }

  .btn-secondary {
    background-color: var(--primary-soft);
    color: var(--text-main);
    border: 1px solid var(--card-border);
    padding: 9px 14px;
    border-radius: 9px;
    font-weight: 600;
    font-size: 13.5px;
    cursor: pointer;
    font-family: 'Noto Sans Bengali', sans-serif;
  }

  @media (max-width: 480px) {
    .book-volume { max-width: 290px; }
    .reader-paper { padding: 16px 12px 14px; }
    .reader-body .arabic-box { font-size: calc(19.5px * var(--font-scale)); padding: 14px 13px; }
    .reader-body .bn-box { padding: 13px 13px; font-size: calc(15px * var(--font-scale)); }
    .toc-row { padding: 12px 14px; }
  }
</style>
</head>

let currentThemeId = "emerald";

let dynamicFirstKick = null;
let dynamicStepIdx = 0;
let toastTimer = null;

function clearDynamicInlineVars() {
  const target = document.body;
  DYNAMIC_VAR_KEYS.forEach(k => target.style.removeProperty(k));
}

function applyDynamicStep(steps) {
  if (document.hidden) return;
  const palette = steps[dynamicStepIdx % steps.length];
  const target = document.body;
  for (const [k, v] of Object.entries(palette)) {
    target.style.setProperty(k, v);
  }
}

function stopDynamicEngine() {
  if (dynamicTimer) { clearInterval(dynamicTimer); dynamicTimer = null; }
  if (dynamicFirstKick) { clearTimeout(dynamicFirstKick); dynamicFirstKick = null; }
  document.body.classList.remove("is-dynamic-mode");
  clearDynamicInlineVars();
}

function startDynamicEngine(steps) {
  stopDynamicEngine();
  document.body.classList.add("is-dynamic-mode");
  dynamicStepIdx = 0;
  applyDynamicStep(steps);

  dynamicFirstKick = setTimeout(() => {
    dynamicStepIdx = (dynamicStepIdx + 1) % steps.length;
    applyDynamicStep(steps);
    dynamicTimer = setInterval(() => {
      dynamicStepIdx = (dynamicStepIdx + 1) % steps.length;
      applyDynamicStep(steps);
    }, 4200);
  }, 600);
}

function showThemeToast(label) {
  const el = document.getElementById("themeToast");
  const txt = document.getElementById("themeToastText");
  txt.textContent = label;
  el.classList.add("show");
  if (toastTimer) clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove("show"), 1350);
}

function applyTheme(themeId, save = true, announce = false) {
  const valid = THEME_CYCLE.find(t => t.id === themeId) || THEME_CYCLE[0];
  currentThemeId = valid.id;

  stopDynamicEngine();

  if (valid.id === "dynamic") {
    document.body.setAttribute("data-theme", "emerald");
    startDynamicEngine(DYNAMIC_LIGHT_STEPS);
  } else if (valid.id === "dynamic-dark") {
    document.body.setAttribute("data-theme", "dynamic-dark");
    startDynamicEngine(DYNAMIC_DARK_STEPS);
  } else {
    document.body.setAttribute("data-theme", valid.id);
  }

  if (save) localStorage.setItem(LS_THEME, valid.id);
  if (announce) showThemeToast(valid.label);
}

function cycleTheme(btnEl) {
  const idx = THEME_CYCLE.findIndex(t => t.id === currentThemeId);
  const next = THEME_CYCLE[(idx + 1) % THEME_CYCLE.length];
  if (btnEl) {
    btnEl.classList.toggle("spun");
  }
  applyTheme(next.id, true, true);
}

/* ==================== UTILITY & LZSS DECOMPRESSOR ==================== */
function b64ToBytes(b64) {
  const bin = atob(b64);
  const out = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
  return out;
}

function hexToBytes(hex) {
  const out = new Uint8Array(hex.length / 2);
  for (let i = 0; i < out.length; i++) {
    out[i] = parseInt(hex.substr(i * 2, 2), 16);
  }
  return out;
}

function bytesToHex(bytes) {
  let s = "";
  for (let i = 0; i < bytes.length; i++) s += bytes[i].toString(16).padStart(2, "0");
  return s;
}

function lzssDecompress(comp) {
  const origLen = (comp[0] | (comp[1] << 8) | (comp[2] << 16) | (comp[3] << 24)) >>> 0;
  const out = new Uint8Array(origLen);
  let src = 4, dst = 0, clen = comp.length;
  while (dst < origLen && src < clen) {
    const flags = comp[src++];
    for (let bit = 0; bit < 8 && dst < origLen; bit++) {
      if ((flags >> bit) & 1) {
        const lo = comp[src++], hi = comp[src++];
        const code = lo | (hi << 8);
        const dist = code >> 4;
        const len = (code & 0x0f) + 3;
        const start = dst - dist;
        for (let k = 0; k < len; k++) {
          out[dst++] = out[start + k];
        }
      } else {
        out[dst++] = comp[src++];
      }
    }
  }
  return out;
}

/* ==================== PURE-JS SHA-256 + HMAC + PBKDF2 (OFFLINE & FILE:// SAFE) ==================== */
const SHA256_K = new Uint32Array([
  0x428a2f98,0x71374491,0xb5c0fbcf,0xe9b5dba5,0x3956c25b,0x59f111f1,0x923f82a4,0xab1c5ed5,
  0xd807aa98,0x12835b01,0x243185be,0x550c7dc3,0x72be5d74,0x80deb1fe,0x9bdc06a7,0xc19bf174,
  0xe49b69c1,0xefbe4786,0x0fc19dc6,0x240ca1cc,0x2de92c6f,0x4a7484aa,0x5cb0a9dc,0x76f988da,
  0x983e5152,0xa831c66d,0xb00327c8,0xbf597fc7,0xc6e00bf3,0xd5a79147,0x06ca6351,0x14292967,
  0x27b70a85,0x2e1b2138,0x4d2c6dfc,0x53380d13,0x650a7354,0x766a0abb,0x81c2c92e,0x92722c85,
  0xa2bfe8a1,0xa81a664b,0xc24b8b70,0xc76c51a3,0xd192e819,0xd6990624,0xf40e3585,0x106aa070,
  0x19a4c116,0x1e376c08,0x2748774c,0x34b0bcb5,0x391c0cb3,0x4ed8aa4a,0x5b9cca4f,0x682e6ff3,
  0x748f82ee,0x78a5636f,0x84c87814,0x8cc70208,0x90befffa,0xa4506ceb,0xbef9a3f7,0xc67178f2
]);

function sha256Pure(msg) {
  const len = msg.length;
  const bitLenHi = Math.floor((len * 8) / 4294967296);
  const bitLenLo = (len * 8) >>> 0;
  const totalLen = ((len + 9 + 63) >> 6) << 6;
  const buf = new Uint8Array(totalLen);
  buf.set(msg);
  buf[len] = 0x80;
  const dv = new DataView(buf.buffer);
  dv.setUint32(totalLen - 8, bitLenHi, false);
  dv.setUint32(totalLen - 4, bitLenLo, false);

  let h0=0x6a09e667, h1=0xbb67ae85, h2=0x3c6ef372, h3=0xa54ff53a;
  let h4=0x510e527f, h5=0x9b05688c, h6=0x1f83d9ab, h7=0x5be0cd19;
  const w = new Uint32Array(64);

  for (let off = 0; off < totalLen; off += 64) {
    for (let i = 0; i < 16; i++) w[i] = dv.getUint32(off + (i << 2), false);
    for (let i = 16; i < 64; i++) {
      const s0 = ((w[i-15] >>> 7) | (w[i-15] << 25)) ^ ((w[i-15] >>> 18) | (w[i-15] << 14)) ^ (w[i-15] >>> 3);
      const s1 = ((w[i-2] >>> 17) | (w[i-2] << 15)) ^ ((w[i-2] >>> 19) | (w[i-2] << 13)) ^ (w[i-2] >>> 10);
      w[i] = (w[i-16] + s0 + w[i-7] + s1) >>> 0;
    }
    let a=h0, b=h1, c=h2, d=h3, e=h4, f=h5, g=h6, h=h7;
    for (let i = 0; i < 64; i++) {
      const S1 = ((e >>> 6) | (e << 26)) ^ ((e >>> 11) | (e << 21)) ^ ((e >>> 25) | (e << 7));
      const ch = (e & f) ^ ((~e) & g);
      const t1 = (h + S1 + ch + SHA256_K[i] + w[i]) >>> 0;
      const S0 = ((a >>> 2) | (a << 30)) ^ ((a >>> 13) | (a << 19)) ^ ((a >>> 22) | (a << 10));
      const maj = (a & b) ^ (a & c) ^ (b & c);
      const t2 = (S0 + maj) >>> 0;
      h = g; g = f; f = e; e = (d + t1) >>> 0;
      d = c; c = b; b = a; a = (t1 + t2) >>> 0;
    }
    h0=(h0+a)>>>0; h1=(h1+b)>>>0; h2=(h2+c)>>>0; h3=(h3+d)>>>0;
    h4=(h4+e)>>>0; h5=(h5+f)>>>0; h6=(h6+g)>>>0; h7=(h7+h)>>>0;
  }
  const out = new Uint8Array(32);
  const odv = new DataView(out.buffer);
  odv.setUint32(0,h0,false); odv.setUint32(4,h1,false); odv.setUint32(8,h2,false); odv.setUint32(12,h3,false);
  odv.setUint32(16,h4,false); odv.setUint32(20,h5,false); odv.setUint32(24,h6,false); odv.setUint32(28,h7,false);
  return out;
}

function hmacSha256Pure(key, data) {
  let k = key.length > 64 ? sha256Pure(key) : key;
  const ipad = new Uint8Array(64 + data.length);
  const opad = new Uint8Array(64 + 32);
  for (let i = 0; i < 64; i++) {
    const kb = i < k.length ? k[i] : 0;
    ipad[i] = kb ^ 0x36;
    opad[i] = kb ^ 0x5c;
  }
  ipad.set(data, 64);
  const inner = sha256Pure(ipad);
  opad.set(inner, 64);
  return sha256Pure(opad);
}

async function derivePBKDF2(pwdStr, saltBytes, iterations, dkLen) {
  const pwdBytes = new TextEncoder().encode(pwdStr);
  if (typeof crypto !== "undefined" && crypto.subtle && typeof crypto.subtle.deriveBits === "function") {
    try {
      const baseKey = await crypto.subtle.importKey("raw", pwdBytes, "PBKDF2", false, ["deriveBits"]);
      const bits = await crypto.subtle.deriveBits(
        { name: "PBKDF2", salt: saltBytes, iterations: iterations, hash: "SHA-256" },
        baseKey,
        dkLen * 8
      );
      return new Uint8Array(bits);
    } catch (e) {}
  }
  const blocks = Math.ceil(dkLen / 32);
  const dk = new Uint8Array(blocks * 32);
  for (let b = 1; b <= blocks; b++) {
    const init = new Uint8Array(saltBytes.length + 4);
    init.set(saltBytes);
    init[saltBytes.length]     = (b >>> 24) & 0xff;
    init[saltBytes.length + 1] = (b >>> 16) & 0xff;
    init[saltBytes.length + 2] = (b >>> 8) & 0xff;
    init[saltBytes.length + 3] = b & 0xff;
    let u = hmacSha256Pure(pwdBytes, init);
    const t = new Uint8Array(u);
    for (let it = 1; it < iterations; it++) {
      u = hmacSha256Pure(pwdBytes, u);
      for (let j = 0; j < 32; j++) t[j] ^= u[j];
    }
    dk.set(t, (b - 1) * 32);
  }
  return dk.subarray(0, dkLen);
}

/* ==================== RFC 8439 CHACHA20 ==================== */
function rotl32(v, c) { return ((v << c) | (v >>> (32 - c))) >>> 0; }

function chacha20Xor(key32, nonce12, data, initCounter = 1) {
  const kdv = new DataView(key32.buffer, key32.byteOffset, 32);
  const ndv = new DataView(nonce12.buffer, nonce12.byteOffset, 12);
  const base = new Uint32Array(16);
  base[0]=0x61707865; base[1]=0x3320646e; base[2]=0x79622d32; base[3]=0x6b206574;
  for (let i = 0; i < 8; i++) base[4 + i] = kdv.getUint32(i * 4, true);
  base[13] = ndv.getUint32(0, true);
  base[14] = ndv.getUint32(4, true);
  base[15] = ndv.getUint32(8, true);

  const out = new Uint8Array(data.length);
  const work = new Uint32Array(16);
  const blockBytes = new Uint8Array(64);
  const bdv = new DataView(blockBytes.buffer);
  let counter = initCounter >>> 0;

  function qr(x, a, b, c, d) {
    x[a]=(x[a]+x[b])>>>0; x[d]=rotl32(x[d]^x[a],16);
    x[c]=(x[c]+x[d])>>>0; x[b]=rotl32(x[b]^x[c],12);
    x[a]=(x[a]+x[b])>>>0; x[d]=rotl32(x[d]^x[a],8);
    x[c]=(x[c]+x[d])>>>0; x[b]=rotl32(x[b]^x[c],7);
  }

  for (let off = 0; off < data.length; off += 64) {
    base[12] = counter;
    work.set(base);
    for (let r = 0; r < 10; r++) {
      qr(work,0,4,8,12); qr(work,1,5,9,13); qr(work,2,6,10,14); qr(work,3,7,11,15);
      qr(work,0,5,10,15); qr(work,1,6,11,12); qr(work,2,7,8,13); qr(work,3,4,9,14);
    }
    for (let i = 0; i < 16; i++) bdv.setUint32(i * 4, (work[i] + base[i]) >>> 0, true);
    const lim = Math.min(64, data.length - off);
    for (let i = 0; i < lim; i++) out[off + i] = data[off + i] ^ blockBytes[i];
    counter = (counter + 1) >>> 0;
  }
  return out;
}

function timingSafeEqual(a, b) {
  if (a.length !== b.length) return false;
  let diff = 0;
  for (let i = 0; i < a.length; i++) diff |= (a[i] ^ b[i]);
  return diff === 0;
}

/* ==================== DECRYPTION & INITIALIZATION ==================== */
function unlockWithDerivedKey(dkBytes) {
  const saltBytes = hexToBytes(SALT_HEX);
  const nonceBytes = hexToBytes(NONCE_HEX);
  const expectedMac = hexToBytes(MAC_HEX);
  const cipherBytes = b64ToBytes(LOCKED_B64);

  const encKey = dkBytes.subarray(0, 32);
  const macKey = dkBytes.subarray(32, 64);

  const macInput = new Uint8Array(saltBytes.length + nonceBytes.length + cipherBytes.length);
  macInput.set(saltBytes, 0);
  macInput.set(nonceBytes, saltBytes.length);
  macInput.set(cipherBytes, saltBytes.length + nonceBytes.length);

  const computedMac = hmacSha256Pure(macKey, macInput);
  if (!timingSafeEqual(computedMac, expectedMac)) return false;

  const compBytes = chacha20Xor(encKey, nonceBytes, cipherBytes, 1);
  const jsonBytes = lzssDecompress(compBytes);
  const arr = JSON.parse(new TextDecoder("utf-8").decode(jsonBytes));
  arr.forEach(p => { pagesMap[p.id] = p; });
  isUnlocked = true;
  updateUnlockUI();
  return true;
}

function updateUnlockUI() {
  const idxBtn = document.getElementById("indexUnlockBtn");
  const idxTxt = document.getElementById("indexUnlockText");
  if (isUnlocked && idxBtn && idxTxt) {
    idxBtn.classList.remove("primary-act");
    idxBtn.classList.add("unlocked-act");
    idxTxt.textContent = "আনলকড";
  }
}

let scrollRafPending = false;
function onScrollThrottled() {
  if (!currentId || scrollRafPending) return;
  scrollRafPending = true;
  requestAnimationFrame(() => {
    scrollRafPending = false;
    updateReadProgress();
  });
}

function initApp() {
  const savedTheme = localStorage.getItem(LS_THEME) || "emerald";
  applyTheme(savedTheme, false, false);

  const savedFont = parseFloat(localStorage.getItem(LS_FONT) || "1");
  if (!isNaN(savedFont) && savedFont >= 0.8 && savedFont <= 1.4) {
    fontScale = savedFont;
    document.documentElement.style.setProperty("--font-scale", fontScale);
  }

  try {
    const freeBytes = lzssDecompress(b64ToBytes(FREE_B64));
    const freeArr = JSON.parse(new TextDecoder("utf-8").decode(freeBytes));
    freeArr.forEach(p => { pagesMap[p.id] = p; });
  } catch (e) {
    console.error("Free load error:", e);
  }

  try {
    const savedDkHex = localStorage.getItem(LS_DK);
    if (savedDkHex && savedDkHex.length === 128) {
      unlockWithDerivedKey(hexToBytes(savedDkHex));
    }
  } catch (e) {}

  renderIndexList();
  renderDrawerList();
  showIndex(false);

  window.addEventListener("scroll", onScrollThrottled, { passive: true });
}

/* ==================== VIEWS & NAVIGATION ==================== */
function setCoverSvgActive(active) {
  const svg = document.getElementById("bookCoverSvg");
  if (!svg) return;
  try {
    if (active && typeof svg.unpauseAnimations === "function") svg.unpauseAnimations();
    else if (!active && typeof svg.pauseAnimations === "function") svg.pauseAnimations();
  } catch (e) {}
}

function showIndex(smoothScroll = true) {
  currentId = null;
  document.body.classList.remove("in-reader");
  toggleDrawer(false);
  const fab = document.getElementById("fabMenuBtn");
  if (fab) fab.style.display = "none";

  document.getElementById("readerView").style.display = "none";
  document.getElementById("progressTrack").style.display = "none";
  document.getElementById("indexView").style.display = "block";
  setCoverSvgActive(true);
  renderIndexList();
  updateDrawerActiveState();
  window.scrollTo({ top: 0, behavior: smoothScroll ? "smooth" : "auto" });
}

function openChapter(id) {
  if (!pagesMap[id]) {
    pendingOpenId = id;
    openUnlockModal();
    return;
  }
  currentId = id;
  const page = pagesMap[id];
  const idx = CATALOG.findIndex(x => x.id === id);

  document.body.classList.add("in-reader");
  const fab = document.getElementById("fabMenuBtn");
  if (fab) fab.style.display = "flex";
  setCoverSvgActive(false);

  document.getElementById("indexView").style.display = "none";
  document.getElementById("readerView").style.display = "block";
  document.getElementById("progressTrack").style.display = "block";

  document.getElementById("readerHeaderLabel").textContent = page.pageLabel;
  document.getElementById("readerBadges").innerHTML = (page.badges || []).map(b => `<span>${b}</span>`).join("");
  document.getElementById("readerBody").innerHTML = page.html;

  document.getElementById("prevPageBtn").disabled = (idx <= 0);
  document.getElementById("nextPageBtn").disabled = (idx >= CATALOG.length - 1);
  document.getElementById("readerCounter").textContent = `${CATALOG[idx].bnNo} / ২১ · ${page.pageLabel}`;

  updateDrawerActiveState();
  window.scrollTo(0, 0);
  updateReadProgress();
}

function stepChapter(delta) {
  const idx = CATALOG.findIndex(x => x.id === currentId);
  const next = idx + delta;
  if (next >= 0 && next < CATALOG.length) openChapter(CATALOG[next].id);
}

function updateReadProgress() {
  if (!currentId) return;
  const docH = document.documentElement.scrollHeight - window.innerHeight;
  const ratio = docH > 0 ? Math.min(1, Math.max(0, window.scrollY / docH)) : 0;
  document.getElementById("progressBar").style.transform = `scaleX(${ratio.toFixed(4)})`;
}

/* ==================== RENDER TOC & DRAWER ==================== */
function renderIndexList() {
  const q = (document.getElementById("tocSearchInput")?.value || "").trim().toLowerCase();
  const fp = `${isUnlocked ? 1 : 0}|${q}`;
  if (fp === lastTocFingerprint) return;
  lastTocFingerprint = fp;

  const list = document.getElementById("tocList");
  const frag = document.createDocumentFragment();
  let shown = 0;

  CATALOG.forEach(item => {
    const hay = `${item.pageLabel} ${item.titleBn} ${item.titleAr} ${item.bnNo}`.toLowerCase();
    if (q && !hay.includes(q)) return;
    shown++;

    const open = !!pagesMap[item.id];
    const row = document.createElement("button");
    row.className = "toc-row" + (open ? "" : " is-locked");
    row.onclick = () => openChapter(item.id);
    row.innerHTML = `
      <span class="toc-num">${item.bnNo}</span>
      <div class="toc-meta">
        <div class="toc-meta-top">
          <span class="toc-page-label">${item.pageLabel}</span>
          <span class="toc-ar-sub">${item.titleAr}</span>
        </div>
        <div class="toc-bn-sub">${item.titleBn}</div>
      </div>
      <span class="toc-status" aria-label="${open ? 'খোলা' : 'লক'}">
        ${open
          ? '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>'
          : '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>'
        }
      </span>
    `;
    frag.appendChild(row);
  });

  list.innerHTML = "";
  if (shown === 0) {
    list.innerHTML = `<div style="padding:26px;text-align:center;color:var(--text-muted);font-size:13.5px;">কোনো অধ্যায় খুঁজে পাওয়া যায়নি।</div>`;
  } else {
    list.appendChild(frag);
  }
}

function renderDrawerList() {
  const list = document.getElementById("drawerList");
  const frag = document.createDocumentFragment();
  CATALOG.forEach(item => {
    const open = !!pagesMap[item.id];
    const btn = document.createElement("button");
    btn.className = "drawer-item" + (item.id === currentId ? " active" : "");
    btn.dataset.id = item.id;
    btn.onclick = () => { toggleDrawer(false); openChapter(item.id); };
    btn.innerHTML = `
      <div style="min-width:0;">
        <div style="font-weight:700;font-size:13px;">${item.bnNo}. ${item.pageLabel}</div>
        <div style="font-size:11.2px;opacity:0.78;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${item.titleBn}</div>
      </div>
      <span style="flex-shrink:0;opacity:0.85;">
        ${open
          ? '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><polyline points="20 6 9 17 4 12"/></svg>'
          : '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>'
        }
      </span>
    `;
    frag.appendChild(btn);
  });
  list.innerHTML = "";
  list.appendChild(frag);
}

function updateDrawerActiveState() {
  const items = document.querySelectorAll("#drawerList .drawer-item");
  items.forEach(el => {
    el.classList.toggle("active", el.dataset.id === currentId);
  });
}

/* ==================== FONT, DRAWER & PASSWORD MODAL ==================== */
function changeFontSize(delta) {
  fontScale = Math.min(1.38, Math.max(0.84, +(fontScale + delta).toFixed(2)));
  document.documentElement.style.setProperty("--font-scale", fontScale);
  localStorage.setItem(LS_FONT, String(fontScale));
}

function toggleDrawer(open) {
  document.getElementById("drawerBackdrop").classList.toggle("open", open);
  document.getElementById("drawerPanel").classList.toggle("open", open);
}

function openUnlockModal() {
  if (isUnlocked) return;
  document.getElementById("pwdErr").textContent = "";
  document.getElementById("pwdInput").value = "";
  document.getElementById("unlockModal").classList.add("open");
  setTimeout(() => document.getElementById("pwdInput").focus(), 70);
}

function closeUnlockModal() {
  pendingOpenId = null;
  document.getElementById("unlockModal").classList.remove("open");
}

async function handleUnlock() {
  const pwd = document.getElementById("pwdInput").value;
  const errEl = document.getElementById("pwdErr");
  const btn = document.getElementById("unlockSubmitBtn");

  if (!pwd) {
    errEl.textContent = "অনুগ্রহ করে পাসওয়ার্ড লিখুন।";
    return;
  }

  errEl.textContent = "";
  btn.disabled = true;
  btn.textContent = "যাচাই হচ্ছে...";

  await new Promise(r => setTimeout(r, 25));

  try {
    const dk = await derivePBKDF2(pwd, hexToBytes(SALT_HEX), PBKDF2_ITERS, 64);
    const ok = unlockWithDerivedKey(dk);
    if (ok) {
      localStorage.setItem(LS_DK, bytesToHex(dk));
      const targetId = pendingOpenId;
      closeUnlockModal();
      lastTocFingerprint = "";
      renderIndexList();
      renderDrawerList();
      if (targetId) openChapter(targetId);
    } else {
      errEl.textContent = "পাসওয়ার্ড সঠিক নয়। আবার চেষ্টা করুন।";
    }
  } catch (e) {
    errEl.textContent = "ডিক্রিপশন ত্রুটি ঘটেছে।";
  } finally {
    btn.disabled = false;
    btn.textContent = "আনলক করুন";
  }
}

initApp();
</script>
